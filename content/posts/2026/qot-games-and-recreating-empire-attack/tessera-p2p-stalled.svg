<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="820" height="600" fill="#ffffff"/>

  <!-- GitHub Pages -->
  <rect x="20" y="16" width="230" height="50" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="135" y="38" font-size="14" font-weight="600" fill="#333" text-anchor="middle">GitHub Pages</text>
  <text x="135" y="56" font-size="12" fill="#666" text-anchor="middle">static web client</text>
  <line x1="135" y1="66" x2="135" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="127" y="104" font-size="11" fill="#555" text-anchor="end">loads into each tab</text>

  <!-- Full mesh: 15 data channels between 6 peers -->
  <g stroke="#3b6fd8" stroke-width="1.3" stroke-opacity="0.55">
    <!-- Alice(135,165) Bob(310,115) Carla(485,165) Host(485,375) Observer(310,425) Bot(135,375) -->
    <line x1="135" y1="165" x2="310" y2="115"/>
    <line x1="135" y1="165" x2="485" y2="165"/>
    <line x1="135" y1="165" x2="485" y2="375"/>
    <line x1="135" y1="165" x2="310" y2="425"/>
    <line x1="135" y1="165" x2="135" y2="375"/>
    <line x1="310" y1="115" x2="485" y2="165"/>
    <line x1="310" y1="115" x2="485" y2="375"/>
    <line x1="310" y1="115" x2="310" y2="425"/>
    <line x1="310" y1="115" x2="135" y2="375"/>
    <line x1="485" y1="165" x2="485" y2="375"/>
    <line x1="485" y1="165" x2="310" y2="425"/>
    <line x1="485" y1="165" x2="135" y2="375"/>
    <line x1="485" y1="375" x2="310" y2="425"/>
    <line x1="485" y1="375" x2="135" y2="375"/>
    <line x1="310" y1="425" x2="135" y2="375"/>
  </g>

  <!-- Mesh label -->
  <rect x="245" y="256" width="130" height="40" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <text x="310" y="273" font-size="12" font-weight="600" fill="#1d3f8a" text-anchor="middle">6 peers,</text>
  <text x="310" y="289" font-size="12" font-weight="600" fill="#1d3f8a" text-anchor="middle">15 data channels</text>

  <!-- Browser tabs -->
  <g text-anchor="middle">
    <rect x="70" y="136" width="130" height="58" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="135" y="161" font-size="14" font-weight="600" fill="#1d3f8a">Browser tab</text>
    <text x="135" y="179" font-size="12" fill="#4a5a7a">player A</text>

    <rect x="245" y="86" width="130" height="58" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="310" y="111" font-size="14" font-weight="600" fill="#1d3f8a">Browser tab</text>
    <text x="310" y="129" font-size="12" fill="#4a5a7a">player B</text>

    <rect x="420" y="136" width="130" height="58" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="485" y="161" font-size="14" font-weight="600" fill="#1d3f8a">Browser tab</text>
    <text x="485" y="179" font-size="12" fill="#4a5a7a">player C</text>
  </g>

  <!-- Headless Node peers -->
  <g text-anchor="middle">
    <rect x="410" y="344" width="150" height="62" rx="10" fill="#f3eefc" stroke="#7a4fd0" stroke-width="1.5"/>
    <text x="485" y="368" font-size="14" font-weight="600" fill="#4a2a8a">Host app</text>
    <text x="485" y="386" font-size="11" fill="#5f4a85">the door, archive,</text>
    <text x="485" y="400" font-size="11" fill="#5f4a85">HTTP reads :8080</text>

    <rect x="235" y="396" width="150" height="58" rx="10" fill="#f3eefc" stroke="#7a4fd0" stroke-width="1.5"/>
    <text x="310" y="420" font-size="14" font-weight="600" fill="#4a2a8a">Observer app</text>
    <text x="310" y="438" font-size="11" fill="#5f4a85">no seat, keeps the record</text>

    <rect x="60" y="346" width="150" height="58" rx="10" fill="#f3eefc" stroke="#7a4fd0" stroke-width="1.5"/>
    <text x="135" y="370" font-size="14" font-weight="600" fill="#4a2a8a">Bot app</text>
    <text x="135" y="388" font-size="11" fill="#5f4a85">one seat, voted in</text>
  </g>

  <!-- Supporting services on the right -->
  <g text-anchor="middle">
    <rect x="620" y="86" width="180" height="56" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="710" y="110" font-size="14" font-weight="600" fill="#333">PeerJS broker</text>
    <text x="710" y="128" font-size="12" fill="#666">introduces peers</text>

    <rect x="620" y="172" width="180" height="56" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="710" y="196" font-size="14" font-weight="600" fill="#333">TURN relay</text>
    <text x="710" y="214" font-size="12" fill="#666">~1 in 5 pairs, behind NAT</text>
  </g>
  <g fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="550" y1="155" x2="620" y2="118"/>
    <line x1="550" y1="180" x2="620" y2="198"/>
  </g>

  <!-- API -->
  <rect x="610" y="300" width="190" height="118" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="705" y="324" font-size="14" font-weight="600" fill="#333" text-anchor="middle">API</text>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="705" y="346">address book</text>
    <text x="705" y="364">archive store</text>
    <text x="705" y="382">leaderboard</text>
    <text x="705" y="404" font-size="11" fill="#888">no authority over games</text>
  </g>

  <!-- Postgres -->
  <g>
    <path d="M655,458 L655,500 A50,10 0 0 0 755,500 L755,458" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <ellipse cx="705" cy="458" rx="50" ry="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
    <text x="705" y="488" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Postgres</text>
  </g>
  <line x1="705" y1="418" x2="705" y2="446" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Peers to API -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M560,366 L607,340"/>
    <path d="M385,440 C470,470 560,440 607,400"/>
    <path d="M550,175 C600,240 640,260 660,297"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="566" y="322" text-anchor="middle">announce,</text>
    <text x="566" y="336" text-anchor="middle">heartbeat</text>
    <text x="490" y="478" text-anchor="middle">upload finished game</text>
    <text x="600" y="268" text-anchor="end">find games</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#444">
    <line x1="20" y1="545" x2="60" y2="545" stroke="#3b6fd8" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="68" y="549">WebRTC data channel</text>

    <rect x="210" y="537" width="16" height="16" rx="4" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="234" y="549">browser</text>

    <rect x="300" y="537" width="16" height="16" rx="4" fill="#f3eefc" stroke="#7a4fd0" stroke-width="1.5"/>
    <text x="324" y="549">Node app (native WebRTC)</text>

    <line x1="500" y1="545" x2="540" y2="545" stroke="#888" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="548" y="549">helps make a link</text>

    <text x="20" y="580" font-size="11" fill="#777">The host could also run a WebSocket relay instead, with every peer on one socket to it.</text>
  </g>
</svg>
