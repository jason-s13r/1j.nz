<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 775 450" width="775" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="775" height="450" fill="#ffffff"/>

  <!-- Cloudflare boundary -->
  <rect x="280" y="30" width="490" height="420" rx="14" fill="#fff8f0" stroke="#f38020" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="300" y="56" font-size="14" font-weight="600" fill="#c25e00">Cloudflare</text>

  <!-- Browser clients -->
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="50" width="180" height="70" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="120" y="81" font-weight="600" fill="#1d3f8a">Browser client</text>
    <text x="120" y="101" font-size="12" fill="#4a5a7a">player A</text>

    <rect x="30" y="140" width="180" height="70" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="120" y="171" font-weight="600" fill="#1d3f8a">Browser client</text>
    <text x="120" y="191" font-size="12" fill="#4a5a7a">player B</text>

    <rect x="30" y="230" width="180" height="70" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="120" y="261" font-weight="600" fill="#1d3f8a">Browser client</text>
    <text x="120" y="281" font-size="12" fill="#4a5a7a">player C</text>
  </g>

  <!-- Clients to Worker -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M210,85 L222,85 C265,85 265,160 306,160 L318,160"/>
    <line x1="210" y1="175" x2="318" y2="175"/>
    <path d="M210,265 L222,265 C265,265 265,190 306,190 L318,190"/>
  </g>
  <text x="243" y="194" font-size="11" fill="#555" text-anchor="middle">WebSocket</text>

  <!-- Worker -->
  <rect x="320" y="135" width="170" height="80" rx="10" fill="#ffffff" stroke="#f38020" stroke-width="1.5"/>
  <text x="405" y="166" font-size="14" font-weight="600" fill="#7a3a00" text-anchor="middle">Worker</text>
  <text x="405" y="186" font-size="12" fill="#6b5a4a" text-anchor="middle">serves the client and API,</text>
  <text x="405" y="202" font-size="12" fill="#6b5a4a" text-anchor="middle">routes to games</text>

  <!-- Worker to Durable Object -->
  <line x1="490" y1="175" x2="568" y2="175" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Durable Object -->
  <rect x="570" y="135" width="180" height="80" rx="10" fill="#ffffff" stroke="#f38020" stroke-width="1.5"/>
  <text x="660" y="166" font-size="14" font-weight="600" fill="#7a3a00" text-anchor="middle">Durable Object</text>
  <text x="660" y="186" font-size="12" fill="#6b5a4a" text-anchor="middle">one per game, keeps it</text>
  <text x="660" y="202" font-size="12" fill="#6b5a4a" text-anchor="middle">running with nobody online</text>

  <!-- Worker reads (arrows point back to the Worker) -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)">
    <path d="M440,217 L440,298 L463,298"/>
    <path d="M370,217 L370,398 L463,398"/>
  </g>
  <text x="378" y="238" font-size="11" fill="#555">reads</text>

  <!-- Durable Object writes -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M620,215 L620,298 L597,298"/>
    <path d="M700,215 L700,398 L597,398"/>
  </g>
  <text x="708" y="238" font-size="11" fill="#555">writes</text>

  <!-- D1 -->
  <rect x="465" y="265" width="130" height="66" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="530" y="289" font-size="14" font-weight="600" fill="#333" text-anchor="middle">D1</text>
  <text x="530" y="306" font-size="11" fill="#666" text-anchor="middle">game listings, players,</text>
  <text x="530" y="320" font-size="11" fill="#666" text-anchor="middle">results, leaderboard</text>

  <!-- R2 -->
  <rect x="465" y="365" width="130" height="66" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="530" y="389" font-size="14" font-weight="600" fill="#333" text-anchor="middle">R2</text>
  <text x="530" y="406" font-size="11" fill="#666" text-anchor="middle">finished games,</text>
  <text x="530" y="420" font-size="11" fill="#666" text-anchor="middle">for replays</text>
</svg>
